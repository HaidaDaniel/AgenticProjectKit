name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Clean-checkout quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Assert toolchain and exact SHA
        run: |
          test "$(node --version)" = "v22.22.1"
          test "$(pnpm --version)" = "10.28.1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fast quality
        run: pnpm quality

      - name: Measure coverage
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build

      - name: Run release quality checks
        run: pnpm release:check

      - name: Validate APK contracts
        run: node dist/cli/index.js lint --json

      - name: Check generated instruction sync
        run: node dist/cli/index.js sync

      - name: Run APK audit on disposable runner
        run: node dist/cli/index.js audit

      - name: Reject tracked drift from checks
        if: ${{ always() }}
        run: |
          git diff --check
          if ! git diff --quiet; then
            echo "::error::quality checks produced tracked working-tree drift"
            git diff --stat
            git diff
            exit 1
          fi
          if ! git diff --cached --quiet; then
            echo "::error::quality checks produced staged drift"
            git diff --cached --stat
            git diff --cached
            exit 1
          fi
          if [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "::error::quality checks produced unexpected untracked files"
            git status --short --untracked-files=all
            exit 1
          fi
